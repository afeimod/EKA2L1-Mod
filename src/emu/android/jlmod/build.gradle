apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'ru.playsoftware.j2meloader'
    compileSdk 34
    ndkVersion '30.0.16248370'

    defaultConfig {
        minSdk 21
        buildConfigField 'String', 'VERSION_NAME', '"0.87.1-jlmod"'
        buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/AndroidManifest.xml'
            java.srcDirs = ['src/java']
            res.srcDirs = ['src/res']
            assets.srcDirs = ['src/assets']
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        prefab true
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/cpp/Android.mk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    api project(':jlmod-dexlib')

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.arch.core:core-common:2.2.0'
    implementation 'androidx.collection:collection-ktx:1.3.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-common:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-rxjava2:2.6.1'
    implementation 'androidx.transition:transition:1.4.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.oboe:oboe:1.7.0'
    implementation('ch.acra:acra-http:5.11.3') {
        exclude group: 'com.google.auto.service', module: 'auto-service'
    }
    implementation 'com.github.yukuku:ambilwarna:2.0.1'
    implementation 'com.github.penn5:donations:3.6.0'
    implementation 'com.github.nikita36078:mobile-ffmpeg:v4.3.2-compact'
    implementation 'com.github.nikita36078:filepicker:4.3.0'
    implementation 'com.github.nikita36078:pngj:2.2.3'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
}
